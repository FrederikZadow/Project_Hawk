<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#000000">
    <link rel="stylesheet" href="main.css">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" type="image/png" href="../public/start/icon.png"/>
    <link rel="apple-touch-icon" href="../public/start/icon.png"/>
    <title>Project Hawk</title>
</head>
<body>
    <div id="start-screen">
        <div class="start-menu">
            <button id="btnStartGame" class="btn">Spiel starten</button>
            <button id="btnContinueGame" class="btn btn-secondary">Fortsetzen</button>
            <button id="btnClearSave" class="btn btn-secondary btn-danger">Spielstand löschen</button>
        </div>
    </div>

    <div id="game-container">
        <img id="story-image" src="" alt="">
        <img id="fail-overlay" src="../public/start/fail.png" alt="Gescheitert">
        <div id="options-container"></div>
    </div>

    <script src="game.js"></script>
</body>
</html>
